name: Publish updates

on:
  push:
    branches: [main]
    paths: [updates.json]
  workflow_dispatch:
    inputs:
      essai:
        description: Dry run, show the Discord message without publishing anything
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release and Discord post
        run: node .github/publier.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ESSAI: ${{ inputs.essai }}
